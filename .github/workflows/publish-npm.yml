name: Publish npm bundle (dsh-open-dream-rsi)

# Publishes the DSH adapter bundle on version tags (v0.3.8 ...) or via
# manual dispatch with an explicit tag (used for a first release whose tag
# predates this workflow). Credentials: npm TRUSTED PUBLISHING (OIDC) —
# no NPM_TOKEN. One-time setup on npmjs.com (package Settings → Trusted
# Publisher → GitHub Actions): owner patrykorwat, repository
# open-dream-rsi, workflow publish-npm.yml, and ALLOW DIRECT PUBLISH —
# configurations created after Sep 2026 default to stage-publish only,
# which would reject plain `npm publish`.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag carrying the version to publish (e.g. v0.3.8); empty = current main HEAD (must be tagged)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC token exchange for npm trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag != '' && inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Version guards (sync across carriers + tag parity)
        run: |
          set -o pipefail
          python3 scripts/check_versions.py
          TAG=$(git describe --tags --exact-match HEAD)
          NPM_VERSION=$(node -p "require('./plugins/deepseek_harness/package.json').version")
          echo "tag: $TAG, npm version: $NPM_VERSION"
          test "${TAG#v}" = "$NPM_VERSION" || {
            echo "::error::tag $TAG does not match the npm version $NPM_VERSION — retag or bump the version."
            exit 1
          }
      - name: Tarball dry-run (pack list)
        run: |
          set -o pipefail
          cd plugins/deepseek_harness
          npm pack --dry-run
      - name: Publish to npm (trusted publishing, OIDC — no stored token)
        run: npm publish
        working-directory: plugins/deepseek_harness
