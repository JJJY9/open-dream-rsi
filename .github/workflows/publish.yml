name: Publish to PyPI

# Publishes on version tags (v0.3.8 ...). Credentials: EITHER a PyPI
# trusted publisher registered at
# https://pypi.org/manage/account/publishing/ (owner patrykorwat,
# repository open-dream-rsi, workflow publish.yml — no secret needed),
# OR a classic API token stored as the repo secret PYPI_API_TOKEN.
# Both paths are wired below; the workflow picks whichever exists.
# NOTE: the `secrets` context is NOT available in step-level `if:`
# conditionals, so the mode is resolved into GITHUB_ENV first.
# A second job in this file publishes the npm bundle
# (dsh-open-dream-rsi) with npm trusted publishing: npm validates the
# WORKFLOW FILE name in the OIDC claims, so the npm publisher is
# registered against this same publish.yml (one file, both registries).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build and publish (tag ${{ github.ref_name }})
    runs-on: ubuntu-latest
    permissions:
      # OIDC token exchange for PyPI trusted publishing.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tag matches pyproject version
        run: |
          set -o pipefail
          VERSION=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "tag: ${GITHUB_REF_NAME}, package version: ${VERSION}"
          test "${GITHUB_REF_NAME#v}" = "$VERSION" || {
            echo "::error::tag ${GITHUB_REF_NAME} does not match pyproject version ${VERSION} — retag or bump the version."
            exit 1
          }
      - name: Version sync across release files
        run: |
          set -o pipefail
          python scripts/check_versions.py
      - name: Build sdist + wheel, validate metadata
        run: |
          set -o pipefail
          python -m pip install build twine
          python -m build
          twine check dist/*
      - name: Skip publish when this version is already on PyPI (idempotent re-tags)
        run: |
          set -o pipefail
          VERSION=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          python -c "import json, urllib.request, sys; published = json.load(urllib.request.urlopen('https://pypi.org/pypi/open-dream-rsi/json'))['info']['version']; sys.exit(0 if published == '$VERSION' else 1)" \
            && { echo "version $VERSION already on PyPI — publish steps will be skipped"; echo "ALREADY_PUBLISHED=true" >> "$GITHUB_ENV"; } \
            || echo "version $VERSION not on PyPI yet — publishing"
      - name: Determine credential mode
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -n "$PYPI_TOKEN" ]; then
            echo "PUBLISH_MODE=token" >> "$GITHUB_ENV"
          else
            echo "PUBLISH_MODE=trusted" >> "$GITHUB_ENV"
          fi
      - name: Publish (trusted publishing, OIDC — no stored secret)
        if: env.PUBLISH_MODE == 'trusted' && env.ALREADY_PUBLISHED != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Publish (API token fallback)
        if: env.PUBLISH_MODE == 'token' && env.ALREADY_PUBLISHED != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  publish-npm:
    name: Publish npm bundle (dsh-open-dream-rsi)
    runs-on: ubuntu-latest
    permissions:
      # OIDC token exchange for npm trusted publishing.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Version guards (sync across carriers + tag parity)
        run: |
          set -o pipefail
          python3 scripts/check_versions.py
          TAG=$(git describe --tags --exact-match HEAD)
          NPM_VERSION=$(node -p "require('./plugins/deepseek_harness/package.json').version")
          echo "tag: $TAG, npm version: $NPM_VERSION"
          test "${TAG#v}" = "$NPM_VERSION" || {
            echo "::error::tag $TAG does not match the npm version $NPM_VERSION — retag or bump the version."
            exit 1
          }
      - name: Tarball dry-run (pack list)
        run: |
          set -o pipefail
          cd plugins/deepseek_harness
          npm pack --dry-run
      - name: Skip when this version is already the latest on npm
        run: |
          set -o pipefail
          NPM_VERSION=$(node -p "require('./plugins/deepseek_harness/package.json').version")
          LATEST=$(npm view dsh-open-dream-rsi version 2>/dev/null || echo none)
          if [ "$LATEST" = "$NPM_VERSION" ]; then
            echo "version $NPM_VERSION is already the latest on npm — skipping publish"
            echo "NPM_ALREADY_PUBLISHED=true" >> "$GITHUB_ENV"
          fi
      - name: Publish to npm (trusted publishing, OIDC — no stored token)
        if: env.NPM_ALREADY_PUBLISHED != 'true'
        run: npm publish
        working-directory: plugins/deepseek_harness

  release:
    name: Create the GitHub Release for the tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create release (skip when the tag already has one)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists — skipping"
            exit 0
          fi
          NOTES=$(python3 - <<'PY'
          import os, re, pathlib
          tag = os.environ["GITHUB_REF_NAME"]
          text = pathlib.Path("CHANGELOG.md").read_text()
          m = re.search(r"## \[" + re.escape(tag[1:]) + r"\][^\n]*\n([\s\S]*?)(?=\n## \[|\Z)", text)
          print(m.group(1).strip() if m else "See CHANGELOG.md for the change list.")
          PY
          )
          gh release create "$GITHUB_REF_NAME" --title "open-dream-rsi ${GITHUB_REF_NAME#v}" --notes "$NOTES"
