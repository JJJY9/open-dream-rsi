name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run stdlib-only test suite
        run: python -m unittest discover -s tests -v 2>&1 | tail -20

  smoke:
    name: Key-free smoke (fresh clone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Demo runs with no install and no API key
        run: python examples/live_loop_demo.py
      - name: Deterministic benchmark runs key-free
        run: python -m open_dream_rsi bench --cycles 3 --markdown
