# dsh-open-dream-rsi bundle layer: the ODR (open-dream-rsi) MCP server over
# stdio behind DSH's first-party bridge. Tools appear as
# mcp__open_dream_rsi__<tool>.
#
# The Python sources ship inside this npm package (open_dream_rsi/, stdlib
# only); the odr-bundle-paths row publishes where they live, and the
# mcp-client row spawns the system python3 against the vendored entry point —
# no pip install, no PYTHONPATH. Only python3 (>= 3.10) must be on PATH.
#
# The dreamer never resolves an LLM endpoint itself: childEnv() points it at
# the bridge's in-process OpenAI-compatible proxy, which forwards every call
# to the model the harness is already configured with (ctx.llm.stream). A
# real OPENAI_BASE_URL in the harness env bypasses the proxy (direct mode).
#
# Paths default to the directory `dsh` was launched from (tasks.json and
# .dream_rsi beside it). Override the mcp-open-dream-rsi row from your
# profile's cordis.patch.yml (same id; a config override replaces the whole
# config).
- insert:
    - id: odr-bundle-paths
      name: dsh-open-dream-rsi/bridge
    - id: mcp-open-dream-rsi
      name: '@deepseek-ai/dsh-mcp-client'
      inject: [odrBundle]
      config:
        serverName: open_dream_rsi
        transport: stdio
        command: !!js ctx.odrBundle.python
        args:
          - !!js ctx.odrBundle.runner
          - 'mcp'
          - '--tasks'
          - !!js process.getBuiltinModule('node:path').join(process.cwd(), 'tasks.json')
          - '--memory'
          - !!js process.getBuiltinModule('node:path').join(process.cwd(), '.dream_rsi')
        env: !!js ctx.odrBundle.childEnv()
        cwd: !!js process.cwd()
        # ODR improvement cycles (odr_run_once, odr_dream) run for many
        # minutes — the 60 s default per-call timeout would kill them
        # mid-cycle. 30 min covers a budget-100 cycle with headroom.
        toolCallTimeoutMs: 1800000
