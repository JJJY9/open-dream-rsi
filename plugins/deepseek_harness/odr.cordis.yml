# ODR (open-dream-rsi) MCP server for DeepSeek Harness — local stdio.
# Apply one-shot:  dsh --patch /ABS/PATH/TO/this/file web
# Persist: merge the - insert: entry into $DSH_HOME/profiles/web/cordis.patch.yml
# (do NOT overwrite an existing patch file — it may hold unrelated patches).
#
# Point --tasks/--memory at ABSOLUTE paths. DSH spawns the child with a
# scrubbed environment (names matching KEY|PASSWORD|SECRET|TOKEN and all
# DSH_* are dropped), so OPENAI_* / ODR_LLM_* are re-passed explicitly below.
- insert:
    - id: mcp-open-dream-rsi
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: open_dream_rsi
        transport: stdio
        command: python3
        args:
          - '-m'
          - 'open_dream_rsi'
          - 'mcp'
          - '--tasks'
          - '/ABSOLUTE/PATH/projects/myproject/tasks.json'
          - '--memory'
          - '/ABSOLUTE/PATH/projects/myproject/.dream_rsi'
        env:
          # DSH scrubs the spawned child's environment (names matching
          # KEY|PASSWORD|SECRET|TOKEN and all DSH_*), so OPENAI_* / ODR_LLM_*
          # are re-passed — but DROPPING unset/empty ones (|| undefined):
          # an empty ODR_LLM_PRESET="" must never reach the child (older ODR
          # releases died with "Unknown preset ''"; Node omits undefined
          # keys at spawn). Without OPENAI_* the dreamer falls back to
          # http://127.0.0.1:8000/v1 with model auto-detection.
          OPENAI_BASE_URL: !!js process.env.OPENAI_BASE_URL || undefined
          OPENAI_API_KEY: !!js process.env.OPENAI_API_KEY || undefined
          ODR_LLM_MODEL: !!js process.env.ODR_LLM_MODEL || undefined
          ODR_LLM_PRESET: !!js process.env.ODR_LLM_PRESET || undefined
          # Running from a checkout (no pip install): the outer shell's
          # PYTHONPATH pointing at the open-dream-rsi repo survives here.
          PYTHONPATH: !!js process.env.PYTHONPATH || undefined
        cwd: !!js process.cwd()
        # ODR improvement cycles (odr_run_once, odr_dream) run for many
        # minutes — the 60 s default per-call timeout would kill them
        # mid-cycle. 30 min covers a budget-100 cycle with headroom.
        toolCallTimeoutMs: 1800000
